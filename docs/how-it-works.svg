<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="10" fill="#0d1117"/>
  <text x="600" y="46" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">One conversation, any machine</text>

  <!-- desktop -->
  <rect x="40" y="78" width="410" height="238" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="66" cy="106" r="5" fill="#7ee787"/>
  <text x="82" y="111" fill="#7ee787" font-size="15" font-weight="600">desktop</text>
  <text x="430" y="111" text-anchor="end" fill="#6e7681" font-size="13">Linux · ~/projects/myapp</text>
  <line x1="56" y1="126" x2="434" y2="126" stroke="#21262d"/>

  <text x="112" y="158" text-anchor="end" fill="#6e7681" font-size="13">you</text>
  <text x="126" y="158" fill="#e6edf3" font-size="15">Add offline caching to the sync layer</text>
  <text x="112" y="196" text-anchor="end" fill="#6e7681" font-size="13">claude</text>
  <text x="126" y="196" fill="#adbac7" font-size="15">The retry policy is the tricky part…</text>
  <text x="112" y="234" text-anchor="end" fill="#6e7681" font-size="13">you</text>
  <text x="126" y="234" fill="#e6edf3" font-size="15">Keep the failed batch, replay it</text>
  <text x="126" y="256" fill="#e6edf3" font-size="15">on reconnect.</text>
  <text x="66" y="294" fill="#6e7681" font-size="14" font-style="italic">…then you shut the machine down</text>

  <!-- vault -->
  <path d="M462 197 H545" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M655 197 H738" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="545" y="150" width="110" height="94" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="182" text-anchor="middle" font-size="24">🔒</text>
  <text x="600" y="209" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">your own</text>
  <text x="600" y="227" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">git repo</text>
  <text x="600" y="272" text-anchor="middle" fill="#6e7681" font-size="12">sessions · memory</text>
  <text x="600" y="290" text-anchor="middle" fill="#6e7681" font-size="12">skills · MCP · settings</text>

  <!-- laptop -->
  <rect x="750" y="78" width="410" height="238" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="776" cy="106" r="5" fill="#ffa8c5"/>
  <text x="792" y="111" fill="#ffa8c5" font-size="15" font-weight="600">laptop</text>
  <text x="1140" y="111" text-anchor="end" fill="#6e7681" font-size="13">macOS · ~/Dev/My Apps/myapp</text>
  <line x1="766" y1="126" x2="1144" y2="126" stroke="#21262d"/>

  <text x="776" y="158" fill="#7ee787" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ claude --resume</text>
  <text x="822" y="196" text-anchor="end" fill="#6e7681" font-size="13">claude</text>
  <text x="836" y="196" fill="#adbac7" font-size="15">Picking up where we left off — the</text>
  <text x="836" y="218" fill="#adbac7" font-size="15">failed batch replays on reconnect.</text>
  <text x="822" y="256" text-anchor="end" fill="#6e7681" font-size="13">you</text>
  <text x="836" y="256" fill="#e6edf3" font-size="15">Right. Now add the backoff.</text>
  <text x="776" y="294" fill="#6e7681" font-size="14" font-style="italic">same conversation, other paths, other OS</text>

  <text x="600" y="360" text-anchor="middle" fill="#adbac7" font-size="15">Paths inside the transcript are rewritten for the machine that opens it.</text>
  <text x="600" y="388" text-anchor="middle" fill="#6e7681" font-size="14">No cloud service and no always-on machine — the desktop can be switched off.</text>
</svg>
